name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86 Release
        shell: pwsh
        run: msbuild HostingTest.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Verify compiled executable
        shell: pwsh
        run: |
          $binary = 'dist/Release/HostingTest.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Missing compiled executable: $binary"
          }

      - name: Clear existing assets from this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $existingRelease = gh release view "$env:RELEASE_TAG" --json assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $assets = ($existingRelease | ConvertFrom-Json).assets
            foreach ($asset in $assets) {
              gh release delete-asset "$env:RELEASE_TAG" "$($asset.name)" --yes
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to remove previous release asset: $($asset.name)"
              }
            }
          }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Release/HostingTest.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
