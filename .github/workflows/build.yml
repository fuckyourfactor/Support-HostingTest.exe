name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86 Release
        shell: pwsh
        run: msbuild HostingTest.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Verify exact original executable
        shell: pwsh
        run: |
          $binary = 'dist/Release/Exact/HostingTest.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing build output: $binary" }
          $hash = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'dfd183ccccf82d684ed6e4952aa071c251419024c2bbb78755563009f9f62c81'
          if ($hash -ne $expected) { throw "Unexpected original executable hash: $hash" }

      - name: Package binaries and extracted assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'release' | Out-Null
          foreach ($flavor in @('Exact', 'Reconstructed')) {
            $folder = "dist/Release/$flavor"
            $binary = Join-Path $folder 'HostingTest.exe'
            $assets = Join-Path $folder 'assets'
            if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) { throw "Missing executable: $binary" }
            if (-not (Test-Path -LiteralPath $assets -PathType Container)) { throw "Missing assets: $assets" }
            Compress-Archive -Path "$folder/*" -DestinationPath "release/HostingTest-$flavor.zip" -CompressionLevel Optimal -Force
            Copy-Item -LiteralPath $binary -Destination "release/HostingTest-$flavor.exe" -Force
          }
          Get-ChildItem -LiteralPath 'release' -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath 'release/SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
