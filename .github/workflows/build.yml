name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86 Release
        shell: pwsh
        run: msbuild HostingTest.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Verify compiled executable
        shell: pwsh
        run: |
          $binary = 'dist/Release/HostingTest.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Missing compiled executable: $binary"
          }

      - name: Remove outdated assets from existing release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;

            try {
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = result.data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist yet; no assets to remove.`);
                return;
              }
              throw error;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100
            });

            for (const asset of assets) {
              core.info(`Removing old release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Release/HostingTest.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
