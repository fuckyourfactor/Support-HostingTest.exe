name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build x86 Release
        shell: pwsh
        run: msbuild HostingTest.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal

      - name: Verify compiled executable
        shell: pwsh
        run: |
          $binary = 'dist/Release/HostingTest.exe'
          if (-not (Test-Path -LiteralPath $binary -PathType Leaf)) {
            throw "Missing compiled executable: $binary"
          }

      - name: Compress executable with UPX 5.3.0 (LZMA)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = 'dist/Release/HostingTest.exe'
          $originalSize = (Get-Item -LiteralPath $binary).Length
          $originalVersion = (Get-Item -LiteralPath $binary).VersionInfo
          $backup = Join-Path $env:RUNNER_TEMP 'HostingTest-uncompressed.exe'
          Copy-Item -LiteralPath $binary -Destination $backup -Force

          $archive = Join-Path $env:RUNNER_TEMP 'upx-5.3.0-win64.zip'
          $downloadUrl = 'https://github.com/upx/upx/releases/download/v5.3.0/upx-5.3.0-win64.zip'
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archive
          $expected = 'd127996c76615e431be810e9c8d2910dbe3dd400600c5c0c50276fc5a17a9705'
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "UPX download checksum mismatch: $actual" }

          $tools = Join-Path $env:RUNNER_TEMP 'hostingtest-upx'
          Expand-Archive -LiteralPath $archive -DestinationPath $tools -Force
          $upx = Join-Path $tools 'upx-5.3.0-win64/upx.exe'
          if (-not (Test-Path -LiteralPath $upx -PathType Leaf)) { throw 'UPX executable not found' }

          & $upx --best --lzma '--compress-icons=0' '--keep-resource=16' $binary
          $packResult = $LASTEXITCODE
          $valid = $packResult -eq 0
          if ($valid) {
            & $upx --test $binary
            $valid = $LASTEXITCODE -eq 0
          }
          if ($valid) {
            $packedVersion = (Get-Item -LiteralPath $binary).VersionInfo
            $valid = ($packedVersion.FileVersion -eq $originalVersion.FileVersion) -and
                     ($packedVersion.ProductName -eq $originalVersion.ProductName) -and
                     ($packedVersion.FileDescription -eq $originalVersion.FileDescription) -and
                     ($packedVersion.OriginalFilename -eq $originalVersion.OriginalFilename)
          }
          if ($valid) {
            $packedSize = (Get-Item -LiteralPath $binary).Length
            $valid = $packedSize -lt $originalSize
          }
          if (-not $valid) {
            Copy-Item -LiteralPath $backup -Destination $binary -Force
            Write-Warning 'UPX did not create a smaller, validated executable; keeping the uncompressed build.'
          }
          $finalSize = (Get-Item -LiteralPath $binary).Length
          Write-Host "Executable size: $originalSize -> $finalSize bytes"

      - name: Remove outdated assets from existing release
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            let release;

            try {
              const result = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              release = result.data;
            } catch (error) {
              if (error.status === 404) {
                core.info(`Release ${tag} does not exist yet; no assets to remove.`);
                return;
              }
              throw error;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100
            });

            for (const asset of assets) {
              core.info(`Removing old release asset: ${asset.name}`);
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
            }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/Release/HostingTest.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          generate_release_notes: true
