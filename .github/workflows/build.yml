name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Build release binaries
        run: msbuild HostingTest.sln /m /p:Configuration=Release /p:Platform=Win32 /verbosity:minimal
        shell: pwsh
      - name: Verify exact binary
        shell: pwsh
        run: |
          $hash = (Get-FileHash 'dist/Release/Exact/HostingTest.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne 'dfd183ccccf82d684ed6e4952aa071c251419024c2bbb78755563009f9f62c81') { throw "Unexpected binary hash: $hash" }
      - uses: actions/upload-artifact@v4
        with:
          name: HostingTest-Release
          path: dist/Release
